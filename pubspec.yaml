name: kc_admin_portal
description: "Keshav Admin Portal — employee, attendance and leave administration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  # Path-based URLs on web (/employees instead of /#/employees).
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  excel: ^4.0.6
  file_saver: ^0.4.0
  timezone: ^0.11.2
  phone_numbers_parser: ^9.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  # Pinned to stable 3.x: freezed 4.x is not yet compatible with this SDK's analyzer.
  freezed: ^3.2.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # The Keshav Clothing "KC" logo (a single-colour mark, tinted in code).
  assets:
    - assets/brand/

  # Bundled (OFL licensed, see assets/fonts/OFL-*.txt) so text renders
  # identically and offline on Android, iOS and Web.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
